name: btc-quant

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: sqlite:////app/storage/btc_quant.db
    OKX_PROXY: ${OKX_PROXY:-}
    SYMBOLS: '["BTC-USDT-SWAP","ETH-USDT-SWAP","DOGE-USDT-SWAP"]'
    COLLECTION_TIMEFRAMES: '["1m","5m","1h"]'
    MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-binance}
    COLLECTOR_INTERVAL_SEC: ${COLLECTOR_INTERVAL_SEC:-15}
  volumes:
    - btc_quant_data:/app/storage

services:
  api:
    <<: *python-service
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8700"]
    ports:
      - "127.0.0.1:8700:8700"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  collector:
    <<: *python-service
    command: ["python", "-m", "scripts.collector_daemon"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  btc_quant_data:
