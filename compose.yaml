name: btc-quant

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Container-specific values override their local-development counterparts.
    DATABASE_URL: sqlite:////app/storage/btc_quant.db
    SYMBOLS: '["BTC-USDT-SWAP","ETH-USDT-SWAP","DOGE-USDT-SWAP"]'
    COLLECTION_TIMEFRAMES: '["1m"]'
  volumes:
    - btc_quant_data:/app/storage

services:
  api:
    <<: *python-service
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8700"]
    ports:
      - "127.0.0.1:8700:8700"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  collector:
    <<: *python-service
    command: ["python", "-m", "scripts.collector_daemon"]
    depends_on:
      api:
        condition: service_healthy

  history-backfill:
    <<: *python-service
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "scripts.backfill", "--all-history", "--cleanup-derived"]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  btc_quant_data:
